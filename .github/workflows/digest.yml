name: Build digest

# Rebuilds data/digests.json from RSS + the curated deck a few times a day and
# commits it. Vercel auto-deploys the commit. No API key, no cost, no manual step.
# Times below are UTC; the comment shows the IST equivalent (UTC+5:30).

on:
  schedule:
    # Every 2 hours at :17 past (04:47, 06:47, 08:47 ... 22:47 IST). GitHub delays or drops
    # scheduled runs at busy minutes (:00, :30), so an off-peak minute and a 2-hour cadence
    # mean a skipped run is covered by the next one.
    - cron: "17 23,1,3,5,7,9,11,13,15,17 * * *"
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
  push:                      # pipeline changes (or a routine's data) -> rebuild at once
    branches: [main]
    paths: ["data/news_llm.json", "data/ai_llm.json", "scripts/**", ".github/workflows/digest.yml"]

permissions:
  contents: write            # so the job can commit data/digests.json

concurrency:
  group: build-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build today's edition from RSS
        run: python3 scripts/build_digest.py

      - name: Commit if the edition changed
        run: |
          git config user.name "digest-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/digests.json
          if git diff --cached --quiet; then
            echo "No change - nothing to publish."
          else
            git commit -m "digest $(TZ=Asia/Kolkata date +%F) $(TZ=Asia/Kolkata date +%H:%M)"
            git pull --rebase origin main   # the routine may have pushed news_llm.json meanwhile
            git push
          fi
